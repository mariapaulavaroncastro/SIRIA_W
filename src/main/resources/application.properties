# Nombre de la aplicacion
spring.application.name=dashboard

# Configuracion de Base de Datos H2 (En Memoria)
spring.datasource.url=jdbc:h2:mem:siriadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar Consola Web H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Creacion automatica de tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MQTT: el gateway Mesh publica JSON en este broker/topic.
siria.mqtt.enabled=${SIRIA_MQTT_ENABLED:true}
siria.mqtt.broker-url=${SIRIA_MQTT_BROKER_URL:tcp://192.168.18.86:1883}
siria.mqtt.client-id=${SIRIA_MQTT_CLIENT_ID:siria-dashboard}
siria.mqtt.topic=${SIRIA_MQTT_TOPIC:siria/telemetria/#}
siria.mqtt.username=${SIRIA_MQTT_USERNAME:}
siria.mqtt.password=${SIRIA_MQTT_PASSWORD:}
siria.mqtt.qos=${SIRIA_MQTT_QOS:1}
siria.mqtt.reconnect-delay-ms=${SIRIA_MQTT_RECONNECT_DELAY_MS:5000}